name: Optimise social preview
on:
  push:
    paths:
      - '.github/workflows/optimise-social-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Export WhatsApp-friendly JPEG
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('assets/social-preview.png').convert('RGB')
          im.thumbnail((1200, 630))
          im.save('assets/social-preview-whatsapp.jpg', 'JPEG', quality=78, optimize=True, progressive=False)
          import os
          print('JPEG bytes:', os.path.getsize('assets/social-preview-whatsapp.jpg'))
          PY
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview-whatsapp.jpg
          git diff --cached --quiet || (git commit -m "Add lightweight WhatsApp preview image" && git push)
