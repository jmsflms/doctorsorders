<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Your Stay | Old Doctor's Manor House</title><meta name="description" content="Explore two-night whole-house weekends in Whitstable: holiday house rental, Run Club Weekender, or House of Deceit."><link rel="canonical" href="https://doctors-orders.co.uk/calendar/"><style>
*{box-sizing:border-box}body{margin:0;color:#17221c;background:#fafaf8;font:17px/1.5 Arial,Helvetica,sans-serif}header{padding:20px max(20px,calc((100vw - 1050px)/2));background:white;border-bottom:1px solid #e2e6e0}header a{color:inherit;text-decoration:none;font-weight:800}main{max-width:1050px;margin:auto;padding:44px 20px 80px}h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1.1;margin:0 0 15px;letter-spacing:-.04em}h2{margin:0 0 12px}p{margin:10px 0}.muted{color:#5e6b61}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:30px 0 22px}.tabs button{font:inherit;border:1px solid #cbd4cb;background:white;padding:18px 12px;font-weight:800;border-radius:7px;cursor:pointer}.tabs button[aria-selected=true]{background:#1b3429;color:white;border-color:#1b3429}.offer{padding:26px;background:#e0f4b1;border-radius:10px;margin-bottom:25px}.offer strong{font-size:clamp(1.5rem,3vw,2.2rem)}.calendar{border:1px solid #dce1db;border-radius:10px;padding:20px;background:white}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}.month button{border:1px solid #d4dcd4;background:white;padding:8px 16px;cursor:pointer;border-radius:5px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays span{font-weight:800;text-align:center;font-size:.82rem;padding:4px}.day{min-height:74px;background:#f8faf6;border:1px solid #e8ebe6;border-radius:5px;padding:9px;text-align:left;font:inherit;cursor:pointer}.day:disabled{color:#acb4aa;background:#f1f2f0;cursor:default}.day.choose{border-color:#1b3429;background:#e0f4b1}.day small{display:block;font-size:.66rem;margin-top:5px;color:#426047}.note{font-size:.86rem;color:#637067}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.btn{background:#1b3429;color:white;text-decoration:none;display:inline-block;padding:14px 22px;font-weight:800;border-radius:5px}.btn.secondary{background:white;color:#1b3429;border:1px solid #1b3429}footer{padding:30px 20px;text-align:center;color:#667166}@media(max-width:650px){main{padding:32px 14px}.tabs{gap:6px}.tabs button{font-size:.79rem;padding:12px 4px}.calendar{padding:10px}.day{padding:5px;min-height:58px;font-size:.88rem}.weekdays,.days{gap:3px}.day small{font-size:.52rem}.offer{padding:20px}}.offer{background:#f3f5f2}.offer strong{font-size:1.55rem}.offer .deal{color:#d52247;font-size:1.12rem;font-weight:800}.day.unavailable{opacity:.65}.day.available{background:#eff8e7;border-color:#b5d3ac}.calendar .loading{color:#58675c}.day.soldout{background:#c8243b;color:#fff;border-color:#c8243b;opacity:1}.day.soldout small{color:#fff;font-weight:800}.day.soldout:disabled{background:#c8243b;color:#fff;opacity:1}html,body{max-width:100%;overflow-x:hidden}.offer{position:relative;isolation:isolate;overflow:hidden;min-height:210px;background:#223d33;color:#fff;padding:32px;display:flex;flex-direction:column;justify-content:center}.offer:before{content:"";position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:.9}.offer:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.83),rgba(0,0,0,.37))}.offer[data-experience="run"]:before{background-image:url('/assets/runclub1.JPG')}.offer[data-experience="house"]:before{background-image:url('/assets/hero%201.png')}.offer[data-experience="hod"]:before{background-image:url('https://www.houseofdeceit.com/assets/video/001-hod-hero-poster.png');background-color:#21142f}.offer strong{font-size:clamp(1.65rem,4vw,2.5rem);line-height:1.12}.offer p{color:#fff;text-shadow:0 1px 5px #111}.offer .deal{color:#ffdf7d;font-weight:900}.tabs button{color:#203d35}.tabs button[aria-selected="true"]{background:#1a382d;color:white}.offer[data-experience="hod"]{background:#25182f}.offer[data-experience="hod"] .deal{color:#ffe29c}.offer[data-experience="run"]{background:#18241d}.offer[data-experience="house"]{background:#254647}@media(max-width:650px){.offer{padding:24px;min-height:220px}.offer strong{font-size:1.8rem}.offer p{line-height:1.35}.tabs button{overflow-wrap:anywhere}}</style></head><body><header><a href="/">THE OLD DOCTOR'S MANOR HOUSE</a></header><main><p class="muted">WHITSTABLE · WHOLE-HOUSE BOOKINGS</p><h1>Choose your weekend.</h1><p>One house, three ways to get everyone together. Select your experience to see the relevant pricing and explore dates.</p><div class="tabs" role="tablist" aria-label="Choose experience"><button id="tab-house" type="button" role="tab" aria-selected="true" data-type="house">The House</button><button id="tab-run" type="button" role="tab" aria-selected="false" data-type="run">Run Club Weekender</button><button id="tab-hod" type="button" role="tab" aria-selected="false" data-type="hod">House of Deceit</button></div><div class="offer" id="experience-offer" data-experience="house" aria-live="polite"><strong id="offer-title"></strong><p id="offer-detail"></p><p id="offer-extra"></p><p id="offer-promo" class="deal"></p></div><div class="calendar"><div class="month"><button id="prev" type="button" aria-label="Previous month">←</button><h2 id="month"></h2><button id="next" type="button" aria-label="Next month">→</button></div><div class="weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="days" id="days"></div></div></main><footer>Old Doctor's Manor House · Whitstable · <a href="/">Back to the house</a></footer><script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
const API='https://script.google.com/macros/s/AKfycbxNawMmEhahRcxid5ii09EFDbEe7QfXpF_ATkzyorO7Z5Vxx36zmg_sgB0FqtJFf_CY/exec';
let type=['house','run','hod'].includes(params.get('experience'))?params.get('experience'):'house';
const today=new Date();today.setHours(0,0,0,0);let month=new Date(today.getFullYear(),today.getMonth(),1),chosen='',feed=null,error=false;
const names={house:'Large Holiday Home',run:'Run Club Weekender',hod:'House of Deceit'};
const specialDates=new Set(['2026-12-27','2026-12-28']);
const manuallySoldOut=new Set(['2026-11-20']);
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function pricing(){
 const winter=month<new Date(2027,3,1);
 if(type==='hod')return ['House of Deceit','An immersive Traitors weekend experience','Minimum 10 people · Friday £166pp · Sunday–Tuesday £120pp','🎄 Friendsmas special £120pp — ask about eligible dates'];
 return [type==='house'?'Large Holiday Home':'Run Club Weekender',type==='house'?'Two nights in Whitstable':'A weekend away for run clubs','Minimum 10 people · £120 per person'+(type==='house'?' · Longer stay? Get in touch.':''),winter?'£100pp WINTER OFFER (Jan–Mar)':''];
}
function eligible(dt){
 if(type==='hod')return dt.getDay()===0||dt.getDay()===3||dt.getDay()===5||specialDates.has(dateKey(dt));
 return dt.getDay()===5;
}
function records(iso){
 return (feed||[]).filter(x=>x.startDate===iso);
}
function render(){
 $('experience-offer').dataset.experience=type;
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.type===type)));
 const p=pricing();$('offer-title').textContent=p[0];$('offer-detail').textContent=p[1];$('offer-extra').textContent=p[2];$('offer-promo').textContent=p[3];
 $('month').textContent=month.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
 $('prev').disabled=month.getFullYear()===today.getFullYear()&&month.getMonth()===today.getMonth();
 const grid=$('days');grid.innerHTML='';const first=(month.getDay()+6)%7;
 for(let i=0;i<first;i++)grid.append(document.createElement('span'));
 for(let d=1;d<=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();d++){
  const dt=new Date(month.getFullYear(),month.getMonth(),d),iso=dateKey(dt);
  const applicable=dt>=today&&eligible(dt),hits=records(iso);
  const soldOut=applicable&&!!feed&&(manuallySoldOut.has(iso)||iso==='2026-12-29'||hits.length===0);
  const available=applicable&&!!feed&&hits.length>0&&!manuallySoldOut.has(iso)&&iso!=='2026-12-29';
  const b=document.createElement('button');b.type='button';b.className='day'+(available?' available':soldOut?' soldout':' unavailable')+(iso===chosen?' choose':'');
  b.disabled=!available;
  let label='';
  if(applicable){label=!feed?(error?'Check dates':'Loading…'):available?'£'+(type==='hod'?(iso==='2026-12-18'?120:(dt.getDay()===5?166:120)):([0,1,2].includes(dt.getMonth())?100:120))+'pp':'SOLD OUT';}
  b.innerHTML='<b>'+d+'</b><small>'+label+(available&&type==='hod'&&dt.getMonth()===11?' 🎄':'')+'</small>';
  b.addEventListener('click',()=>{chosen=iso;render()});grid.append(b);
 }

}
async function load(){try{const r=await fetch(API+'?action=availability',{redirect:'follow'});if(!r.ok)throw Error('fetch');const data=await r.json();if(!Array.isArray(data.availability))throw Error('feed');feed=data.availability;error=false;}catch(e){error=true;}render();}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.type;chosen='';history.replaceState(null,'','?experience='+type);render()}));
$('prev').addEventListener('click',()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);chosen='';render()});
$('next').addEventListener('click',()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);chosen='';render()});
render();load();
</script></body></html>
